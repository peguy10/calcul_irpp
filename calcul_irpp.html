<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>IRPP – Déclaration & Calcul</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --brand:#f5a623;
      --ink:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --bg:#f9fafb;
      --card:#ffffff;
      --accent:#fde7c1;
    }
    *{box-sizing:border-box}
    body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);margin:0;color:var(--ink)}
    .wrap{max-width:1200px;margin:28px auto;padding:0 16px}
    header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .logo{width:28px;height:28px;border-radius:6px;background:var(--brand)}
    h1{font-size:22px;margin:0}
    .tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin:10px 0 18px}
    .tab{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;cursor:pointer}
    .tab.active{background:var(--accent);border-color:#f6c375}
    .tab.active.disabled-cell{background:var(--accent);border-color:#f6c375;font-weight: normal;cursor: default;color: gray;}
    .panel{display:none}
    .autocomplete-container {position: relative; width: 120px;}
    .autocomplete-list {position: absolute; top: 100%; left: 0; right: 0; border: 1px solid #ccc; border-top: none; max-height: 150px; overflow-y: auto; background: white; z-index: 99; display: none;}
    .autocomplete-item {padding: 8px; cursor: pointer;}
    .autocomplete-list {position: absolute; top: 100%; left: 0; right: 0; z-index: 1000; background: white; border: 1px solid #ccc; max-height: 200px; overflow-y: auto; display: none;}
    .autocomplete-item:hover {background: #f0f0f0;}
    .panel.active{display:block}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);padding:12px}
    fieldset{border:0;margin:14px 0 8px;padding:0}
    legend{background:var(--accent);border:1px solid #f6c375;border-radius:8px;padding:8px 10px;font-weight:700}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{border:1px solid var(--line);padding:8px;text-align:center}
    th{background:#fcfcfc}
    input[type=number]{width:140px;padding:6px;border:1px solid var(--line);border-radius:8px}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
    .summary .box{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
    .footer{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
    .btn{appearance:none;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}
    .primary{background:var(--brand);color:#fff}
    .ghost{background:#eef2ff;color:#374151}
    .totals{font-size:16px;font-weight:800}
    .right{display:flex;gap:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo"></div>
      <h1>Déclaration IRPP – Formulaires & Calcul</h1>
    </header>

    <div class="tabs" id="tabs"></div>

    <div id="panels"></div>

    <div class="card" style="margin-top:18px">
      <div class="footer">
        <button class="ghost btn" onclick="history.back()">← Précédent</button>
        <div class="right">
          <div class="totals">Montant Total des Impôts (toutes catégories) : <span id="grandTotal">0</span></div>
          <button class="primary btn" id="save">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // -------- utilitaires --------
    const toNum = v => isNaN(parseFloat(v)) ? 0 : parseFloat(v);
    const fmt = n => new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}).format(n);

    // --------- templates par catégorie (HTML + calcul spécifique) ---------
    const Catalog = {
      // ---------- CAT1 ----------
        cat1: {
            title: 'I – Traitements, Salaires, Pensions et Rentes Viagères',
            render(){
                const id='cat1';
                return `
                <div class="card panel" id="panel-${id}">
                    <fieldset>
                        <legend>${this.title}</legend>
                        <table>
                            <thead>
                            <tr>
                                <th style="width:80px">Ligne</th>
                                <th>Libellé</th>
                                <th>Base imposable annuelle</th>
                                <th>Retenues opérées</th>
                                <th>Impôt dû</th>
                            </tr>
                            </thead>
                            <tbody>
                            ${[
                                {code:'LINE01',label:'Traitement / Salaire, pension ou rente de base annuel(le)'},
                                {code:'LINE02',label:'Autre traitement salarial'},
                                {code:'LINE03',label:'Revenus exceptionnels'},
                            ].map((r,i)=>`
                                    <tr>
                                    <td>${r.code}</td>
                                    <td style="text-align:left">${r.label}</td>
                                    <td><input type="number" class="c1-base" value="0"></td>
                                    <td><input type="number" class="c1-ret" value="0"></td>
                                    <td class="c1-tax">0</td>
                                    </tr>
                            `).join('')}
                            </tbody>
                        </table>
                    </fieldset>

                    <div class="summary">
                        <div class="box">
                            <div><b>Récap – Base imposable annuelle</b></div>
                            <div id="c1-sum-base">0</div>
                        </div>
                        <div class="box">
                            <div><b>Montant retenu / déjà payé</b></div>
                            <div id="c1-sum-ret">0</div>
                        </div>
                        <div class="box">
                            <div><b>Montant impôts</b></div>
                            <div id="c1-sum-tax">0</div>
                        </div>
                        <div class="box">
                            <div><b>Montant à payer</b></div>
                            <div id="c1-to-pay">0</div>
                        </div>
                    </div>
                </div>`;
            },
            compute(panel){
            let sumBase=0,sumRet=0,sumTax=0;
            const rows = panel.querySelectorAll('tbody tr');
            rows.forEach(tr=>{
                const base = toNum(tr.querySelector('.c1-base').value);
                const ret  = toNum(tr.querySelector('.c1-ret').value);
                const tax  = Math.max(base - ret, 0); // logique propre Cat1
                tr.querySelector('.c1-tax').textContent = fmt(tax);
                sumBase += base; sumRet += ret; sumTax += tax;
            });
            panel.querySelector('#c1-sum-base').textContent = fmt(sumBase);
            panel.querySelector('#c1-sum-ret').textContent  = fmt(sumRet);
            panel.querySelector('#c1-sum-tax').textContent  = fmt(sumTax);
            const toPay = Math.max(sumTax - sumRet, 0);
            panel.querySelector('#c1-to-pay').textContent   = fmt(toPay);
            return sumTax; // renvoyé pour le grand total
            }
        },

      // ---------- CAT2 ----------
        cat2: {
            title: 'II – Revenus de Capitaux Mobiliers',
            render(){
            const id='cat2';
            const lines = [
                {code:'LINE05',label:"Revenus des produits des actions, parts de capital et assimilés",taux:15},
                {code:'LINE06',label:"Revenus des obligations",taux:15},
                {code:'LINE08',label:"Montant des placements sur les comptes épargne",taux:0},
                {code:'LINE07',label:"Revenus des créances, dépôts, cautionnements et comptes courants",taux:15},
                {code:'LINE09',label:"Intérêts des comptes d'épargne (partie imposable)",taux:15},
                {code:'LINE10',label:"Gains sur cession d'actions, d'obligations et autres parts de capital",taux:15},
                {code:'LINE11',label:"Revenus tirés des actifs numériques",taux:15},
                {code:'LINE12',label:"Rémunération des obligations (≥ 5 ans)",taux:5},
                {code:'LINE13',label:"Revenus valeurs mobilières admises à la cote BVMAC",taux:10},
                {code:'LINE14',label:"Revenus capitaux mobiliers payés dans un paradis fiscal",taux:30},
                {code:'LINE15',label:"Revenus des placements exonérés",taux:0},
                {code:'LINE16',label:"Autres revenus (préciser)",taux:15},
            ];
            const body = lines.map(r=>`
                <tr>
                <td>${r.code}</td>
                <td style="text-align:left">${r.label}</td>
                <td><input type="number" class="c2-net" value="0"></td>
                <td><input type="number" class="c2-brut" value="0"></td>
                <td><input type="number" class="c2-taux" value="${r.taux}"></td>
                <td class="c2-principal">0</td>
                </tr>
            `).join('');

            return `
            <div class="card panel" id="panel-${id}">
                <fieldset>
                <legend>${this.title}</legend>
                <table>
                    <thead>
                    <tr>
                        <th style="width:80px">Ligne</th>
                        <th>Libellé</th>
                        <th>Revenu net imposable</th>
                        <th>Revenu brut imposable</th>
                        <th>Taux (%)</th>
                        <th>Principal</th>
                    </tr>
                    </thead>
                    <tbody>${body}</tbody>
                    <tfoot>
                    <tr>
                        <th colspan="5" style="text-align:right">TOTAL</th>
                        <th id="c2-total">0</th>
                    </tr>
                    </tfoot>
                </table>
                </fieldset>

                <fieldset>
                <legend>IRCM PAYER</legend>
                <table>
                    <thead>
                    <tr>
                        <th style="width:280px"></th>
                        <th>Montant retenu / déjà payé</th>
                        <th>Principal</th>
                        <th>CAC</th>
                        <th>Pénalités</th>
                        <th>Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>IRPP sur IRCM dû</td>
                        <td class="c2-irpp-due-ret">0</td>
                        <td class="c2-irpp-due-principal">0</td>
                        <td class="c2-irpp-due-cac">0</td>
                        <td class="c2-irpp-due-pen">0</td>
                        <td class="c2-irpp-due-total">0</td>
                    </tr>
                    <tr>
                        <td>IRPP sur RCM retenu à la source</td>
                        <td><input type="number" id="c2-ret-source" value="0"></td>
                        <td class="c2-empty"></td>
                        <td class="c2-empty"></td>
                        <td class="c2-empty"></td>
                        <td class="c2-ret-source-show">0</td>
                    </tr>
                    <tr>
                        <td>IRPP sur RCM à payer</td>
                        <td class="c2-empty"></td>
                        <td class="c2-rcm-pay-principal">0</td>
                        <td class="c2-rcm-pay-cac">0</td>
                        <td class="c2-rcm-pay-pen">0</td>
                        <td class="c2-rcm-pay-total">0</td>
                    </tr>
                    </tbody>
                </table>
                </fieldset>
            </div>`;
            },
            compute(panel){
            // lignes principales
            let total = 0;
            panel.querySelectorAll('tbody tr').forEach(tr=>{
                const brut = toNum(tr.querySelector('.c2-brut').value);
                const taux = toNum(tr.querySelector('.c2-taux').value);
                const principal = brut * (taux/100); // logique Cat2
                tr.querySelector('.c2-principal').textContent = fmt(principal);
                total += principal;
            });
            panel.querySelector('#c2-total').textContent = fmt(total);

            // Bloc IRCM
            // IRPP dû = total principal (on ventile dans la 1ère ligne du bloc)
            panel.querySelector('.c2-irpp-due-principal').textContent = fmt(total);
            panel.querySelector('.c2-irpp-due-cac').textContent = fmt(0);
            panel.querySelector('.c2-irpp-due-pen').textContent = fmt(0);
            const irppDueTotal = total;
            panel.querySelector('.c2-irpp-due-total').textContent = fmt(irppDueTotal);

            // Montant retenu à la source (ligne 2)
            const retenuSource = toNum(panel.querySelector('#c2-ret-source').value);
            panel.querySelector('.c2-ret-source-show').textContent = fmt(retenuSource);

            // À payer (ligne 3)
            const aPayer = Math.max(irppDueTotal - retenuSource, 0);
            panel.querySelector('.c2-rcm-pay-principal').textContent = fmt(aPayer);
            panel.querySelector('.c2-rcm-pay-cac').textContent = fmt(0);
            panel.querySelector('.c2-rcm-pay-pen').textContent = fmt(0);
            panel.querySelector('.c2-rcm-pay-total').textContent = fmt(aPayer);

            return irppDueTotal; // remonte pour grand total
            }
        },
        // ---------- CAT3 ----------
        cat3: {
            title: 'III - Revenus Fonciers',
            render(){
                const id='cat3';
                return `
                <div class="card panel" id="panel-${id}">
                    <fieldset>
                        <legend>III - A. LOYERS PERÇUS</legend>
                        <table id="loyersTable" style="min-width: 1040px; border-collapse: collapse;">
                            <thead>
                                <tr>
                                    <th>IMMEUBLE</th>
                                    <th>VILLE</th>
                                    <th>COMMUNE</th>
                                    <th>QUARTIER</th>
                                    <th>LOCALISATION</th>
                                    <th>LOYERS PARTICULIERS</th>
                                    <th style="width: 120px;">LOYERS PROFESSIONNELS</th>
                                </tr>
                            </thead>
                            <tbody id="loyersBody">
                                <tr>
                                    <td><input type="text" style="font-weight: bold; font-size: 12px; border: none;" placeholder="IMMEUBLE N"></td>
                                    <td><input type="text" style="width: 120px; padding: 0;"></td>
                                    <td class="autocomplete-container"><input type="text" style="width: 120px; padding: 0;" class="autocomplete-input">
                                        <div class="autocomplete-list"></div>
                                    </td>
                                    <td><input type="text" style="width: 90px; padding: 0;"></td>
                                    <td><input type="text" style="width: 120px; padding: 0;"></td>
                                    <td><input type="number" placeholder="0" style="width: 120px; padding: 0;"></td>
                                    <td><input type="number" placeholder="0" style="width: 120px; padding: 0;"></td>
                                    <td class="delete-cell"></td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr class="totals">
                                    <td colspan="5" style="text-align: left;">TOTAL DES LOYERS PERÇUS</td>
                                    <td class="tab active disabled-cell" id="totalPart" style="text-align: left; width: 120px;">0</td>
                                    <td class="tab active disabled-cell" id="totalPro" style="text-align: left; width: 120px;">0</td>
                                </tr>
                                <tr>
                                    <td colspan="6" style="text-align: left; font-weight: bold;">Charges forfaitaires (30%)</td>
                                    <td class="tab active disabled-cell" id="chargesForf" style="text-align: left; width: 120px;">0</td>
                                </tr>
                                <tr>
                                    <td colspan="6" style="text-align: left; font-weight: bold;">Charges réelles justifiées</td>
                                    <td style="text-align: center; width: 120px;"><input type="number" id="chargesReelles" placeholder="0"></td>
                                </tr>
                                <tr class="totals">
                                    <td colspan="5" style="text-align: left;">Total des loyers nets</td>
                                    <td class="tab active disabled-cell" id="totalNetPart" style="text-align: left; width: 120px;">0</td>
                                    <td class="tab active disabled-cell" id="totalNetPro" style="text-align: left; width: 120px;">0</td>
                                </tr>
                            </tfoot>
                        </table>

                        <legend style="margin-top: 30px;" >III - B. PLUS-VALUES SUR CESSION IMMOBILIERS DE PARTICULIERS</legend>
                        <table id="plusValuesTable">
                            <thead>
                                <tr>
                                    <th>IMMEUBLE</th>
                                    <th>VILLE</th>
                                    <th>COMMUNE</th>
                                    <th>QUARTIER</th>
                                    <th>LOCALISATION</th>
                                    <th>MONTANT VENDU</th>
                                    <th>MONTANT ACQUIS</th>
                                    <th>AUTRES CHARGES DÉDUCTIBLES À JUSTIFIER</th>
                                    <th>MODE DE PAIEMENT</th>
                                    <th>MONTANT DES PLUS-VALUES/MOINS-VALUES</th>
                                </tr>
                            </thead>
                            <tbody id="plusValuesBody">
                                <tr>
                                    <td style="font-weight: bold; font-size: 12px; border: none;" >IMMEUBLE N</td>
                                    <td><input type="text" style="width: 60px;"></td>
                                    <td><input type="text" style="width: 90px;"></td>
                                    <td><input type="text" style="width: 90px;"></td>
                                    <td><input type="text" style="width: 120px;"></td>
                                    <td><input type="number" placeholder="0" class="montantVendu" style="width: 90px;"></td>
                                    <td><input type="number" placeholder="0" class="montantAcquis" style="width: 90px;"></td>
                                    <td><input type="number" placeholder="0" class="autreChargeDed" style="width: 120px;"></td>
                                    <td style="width: 90px;">
                                        <select>
                                            <option value="" selected disabled hidden></option>
                                            <option value="cash">Espèces</option>
                                            <option value="wireTransfer">Virement</option>
                                        </select>
                                    </td>
                                    <td class="tab active disabled-cell montantDesPlu" style="text-align: left; width: 90px;">0</td>
                                    <td class="delete-cell"></td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="9" style="text-align: left; font-weight: bold;">Total des plus-values sur les ventes immobilières</td>
                                    <td class="tab active disabled-cell" style="width: 90px; text-align: left;">0</td>
                                </tr>
                                <tr>
                                    <td colspan="9" style="text-align: left; font-weight: bold;">Charges forfaitaires (30%)</td>
                                    <td class="tab active disabled-cell" style="width: 90px; text-align: left;">0</td>
                                </tr>
                                <tr>
                                    <td colspan="9" style="text-align: left; font-weight: bold;">Charges réelles justifiées</td>
                                    <td><input type="number" placeholder="0" style="width: 90px;"></td>
                                </tr>
                                <tr>
                                    <td colspan="9" style="text-align: left; font-weight: bold;">Total des plus-values nettes</td>
                                    <td class="tab active disabled-cell" style="text-align: left;">0</td>
                                </tr>
                            </tfoot>
                        </table>

                        <legend style="margin-top: 30px;" >III - C. PARTS DE PARTICIPATION ASSOCIÉES DE SOCIÉTÉS CIVILES IMMOBILIÈRES</legend>
                        <table id="partsDeParticipation">
                            <thead>
                                <tr>
                                    <th>SOCIÉTÉ CIVILE IMMOBILIÈRE (SCI)</th>
                                    <th>NIU</th>
                                    <th>NOM/RAISON SOCIALE</th>
                                    <th>ADRESSE</th>
                                    <th>PHONE NUMBER</th>
                                    <th>REVENU BRUT DES ACTIONS PERÇUES</th>
                                </tr>
                            </thead>
                            <tbody id="partsDeParticipBody">
                                <tr>
                                    <td style="font-weight: bold; font-size: 12px; border: none; width: 200px;" >SCI N</td>
                                    <td><input type="text" style="width: 90px;"></td>
                                    <td><input type="text" style="width: 120px;"></td>
                                    <td><input type="text" style="width: 120px;"></td>
                                    <td><input type="text" style="width: 120px;"></td>
                                    <td><input type="number" placeholder="0" style="width: 120px;"></td>
                                    <td class="delete-cell"></td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="5" style="text-align: left; font-weight: bold;">TOTAL DES PARTICIPATIONS</td>
                                    <td class="tab active disabled-cell" style="width: 120px; text-align: left;" id="totalDesParticip">0</td>
                                </tr>
                            </tfoot>
                        </table>

                        <legend style="margin-top: 30px;" >IRPP SUR RF À PAYER</legend>
                        <table id="irppSurRf">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th>MONTANT RETENU/DÉJÀ PAYÉ</th>
                                    <th>PRINCIPAL</th>
                                    <th>CAC (10%)</th>
                                    <th>PÉNALITÉS</th>
                                    <th>TOTAL</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td style="font-weight: bold; font-size: 12px; border: none; width: 200px; background: #fcfcfc;" >IRPP dû sur RF loyers au taux libératoire (10%)</td>
                                    <td style="width: 120px; border: none"></td>
                                    <td class="tab active disabled-cell" id="tauxLiberatoirPrincipal" style="width: 120px;"></td>
                                    <td class="tab active disabled-cell" style="width: 60px;"><input type="number" class="tab active disabled-cell" id="tauxLiberatoirCac" style="width: 60px; border: none;"></td>
                                    <td class="tab active disabled-cell" id="tauxLiberatoirPenalites" style="width: 120px;"></td>
                                    <td class="tab active disabled-cell" id="tauxLiberatoirTotal" style="width: 120px;"></td>
                                </tr>
                                 <tr>
                                    <td style="font-weight: bold; font-size: 12px; border: none; width: 200px; background: #fcfcfc;">IRPP dû sur loyers perçus auprès des professionnels et part d'intérêts (25% ou 30%)</td>
                                    <td style="width: 120px; border: none"></td>
                                    <td class="tab active disabled-cell" id="taux_25_30_Principal" style="width: 120px;"></td>
                                    <td class="tab active disabled-cell" style="width: 60px;"><input type="number" class="tab active disabled-cell" id="taux_25_30_cac" style="width: 60px; border: none;"></td>
                                    <td class="tab active disabled-cell" id="taux_25_30_Penalites" style="width: 120px;"></td>
                                    <td class="tab active disabled-cell" id="taux_25_30_Total" style="width: 120px;"></td>
                                </tr>
                                <tr>
                                    <td style="font-weight: bold; font-size: 12px; border: none; width: 200px; background: #fcfcfc;" >IRPP dû sur loyers perçus auprès des professionnels et part d'intérêts au taux de minimum de perception</td>
                                    <td style="width: 120px; border: none"></td>
                                    <td class="tab active disabled-cell" id="tauxMinPerceptionPrincipal" style="width: 120px;"></td>
                                    <td class="tab active disabled-cell" style="width: 60px;"><input type="number" class="tab active disabled-cell" id="tauxMinPerceptionCac" style="width: 60px; border: none;"></td>
                                    <td class="tab active disabled-cell" id="tauxMinPerceptionPenalites" style="width: 120px;"></td>
                                    <td class="tab active disabled-cell" id="tauxMinPerceptionTotal" style="width: 120px;"></td>
                                </tr>
                                <tr>
                                    <td style="font-weight: bold; font-size: 12px; border: none; width: 200px; background: #fcfcfc;" >IRPP dû sur la plus-value (5% ou 10%)</td>
                                    <td style="width: 120px; border: none"></td>
                                    <td class="tab active disabled-cell" id="plus_value_Principal" style="width: 120px;"></td>
                                    <td class="tab active disabled-cell" style="width: 60px;"><input type="number" class="tab active disabled-cell" id="plus_value_Cac" style="width: 60px; border: none;"></td>
                                    <td class="tab active disabled-cell" id="plus_value_Penalites" style="width: 120px;"></td>
                                    <td class="tab active disabled-cell" id="plus_value_Total" style="width: 120px;"></td>
                                </tr>
                                <tr>
                                    <td style="font-weight: bold; font-size: 12px; border: none; width: 200px; background: #fcfcfc;" >IRPP sur revenus fonciers retenu à la source</td>

                        list.innerHTML = "";

                        items.forEach(match => {
                            const div = document.createElement("div");
                            div.classList.add("autocomplete-item");
                            div.textContent = match;
                            div.addEventListener("click", function() {
                                input.value = this.textContent;

                            });

                        list.style.display = "block";

                    {code:'LINE70',label:"Revenus d'exploitation minière, pétrolière et gazière"},
                    {code:'LINE71',label:"Revenus d'exploitation forestière"},
                    {code:'LINE72',label:"Revenus intermédiaires achat / vente (Immeuble / fonds de commerce)"},
                    {code:'LINE73',label:"Revenus vente des terrains lotis"},
                    {code:'LINE74',label:"Revenus location d'établissement commercial et industriel meublé"},
                    {code:'LINE75',label:"Revenus location ou sous-location d'Immeuble meublé"},
                    {code:'LINE76',label:"Revenus exploitation de jeux de hasard et de divertissement"},
                    {code:'LINE77',label:"Revenus de mandataire ou agent commercial non salarié"},
                    {code:'LINE78',label:"Rémunération dans le cadre de la vente directe par réseau"},
                    {code:'LINE79',label:"Autres, à préciser dans la ligne suivante :"}
                ];
                const body = lines.map(r=>`
                    <tr data-line="${r.code}">
                    <td>${r.code}</td>
                    <td style="text-align:left">${r.label}</td>
                    <td><input type="number" class="c5-ca" placeholder="0"></td>
                    <td><input type="number" class="c5-marge-brut" placeholder="0"></td>
                    <td><input type="number" class="c5-ben-imp" placeholder="0"></td>
                    </tr>
                `).join('');

                return `
                <div class="card panel" id="panel-${id}">
                    <fieldset>
                    <legend>${this.title}</legend>
                    <table>
                        <thead>
                        <tr>
                            <th></th>
                            <th></th>
                            <th>CHIFFRE D'AFFAIRES</th>
                            <th>MARGE BRUTE</th>
                            <th>BÉNÉFICE IMPOSABLE</th>
                            
                        </tr>
                        </thead>
                        <tbody>${body}</tbody>
                        <tfoot>
                        <tr>
                            <th colspan="2" style="text-align:left">Total bénéfice taxable</th>
                            <th id="c5-total-ca" class="tab active disabled-cell" style="text-align: left;">0</th>
                            <th id="c5-total-mb" class="tab active disabled-cell" style="text-align: left;">0</th>
                            <th id="c5-total-bi" class="tab active disabled-cell" style="text-align: left;">0</th>

                        </tr>
                        </tfoot>
                    </table>
                    </fieldset>

                    <fieldset>
                    <legend>IRPP sur BA à payer</legend>
                    <table>
                        <thead>
                        <tr>
                            <th style="width:280px"></th>
                            <th>Montant retenu / déjà payé</th>
                            <th>Principal</th>
                            <th>CAC</th>
                            <th>Pénalités</th>
                            <th>Total</th>
                        </tr>
                        </thead>
                        <tfoot>
                        <tr>
                            <td>IRPP sur BA dû</td>
                            <td></td>
                            <td class="tab active disabled-cell c5-irpp-due-principal" style="text-align: left; width: 120px;">0</td>
                            <td class="tab active disabled-cell c5-irpp-due-cac" style="text-align: left; width: 90px;">0</td>
                            <td class="tab active disabled-cell c5-irpp-due-pen" style="text-align: left; width: 120px;">0</td>
                            <td class="tab active disabled-cell c5-irpp-due-total" style="text-align: left; width: 120px;">0</td>
                        </tr>
                        <tr>
                            <td>IRPP sur BAIC au taux de minimum de perception basé sur le Chiffre d'affaires</td>
                            <td></td>
                            <td class="tab active disabled-cell c5-min-ca-principal" style="text-align: left; width: 120px;">0</td>
                            <td class="tab active disabled-cell c5-min-ca-cac" style="text-align: left; width: 90px;">0</td>
                            <td class="tab active disabled-cell c5-min-ca-pen" style="text-align: left; width: 120px;">0</td>
                            <td class="tab active disabled-cell c5-min-ca-total" style="text-align: left; width: 120px;">0</td>
                        </tr>
                        <tr>
                            <td>IRPP sur BAIC au taux de minimum de perception basé sur la Marge brute</td>
                            <td class="c5-empty"><input type="number" id="c5-ret-source" placeholder="0" style="width: 120px;"></td>
                            <td class="tab active disabled-cell c5-min-mb-principal" style="text-align: left; width: 120px;">0</td>
                            <td class="tab active disabled-cell c5-min-mb-cac" style="text-align: left;width: 90px;">0</td>
                            <td class="tab active disabled-cell c5-min-mb-pen" style="text-align: left; width: 120px;">0</td>
                            <td class="tab active disabled-cell c5-min-mb-total" style="text-align: left; width: 120px;">0</td>
                        </tr>
                        <tr>
                            <td>IRPP sur BAIC déjà payée (notamment dans la DSF) ou retenu à la source</td>
                            <td></td>
                            <td class="tab active disabled-cell c5-dsf-principal" style="text-align: left; width: 120px;">0</td>
                            <td class="tab active disabled-cell c5-dsf-cac" style="text-align: left; width: 90px;">0</td>
                            <td class="tab active disabled-cell c5-dsf-pen" style="text-align: left; width: 120px;">0</td>
                            <td class="tab active disabled-cell c5-dsf-total" style="text-align: left; width: 120px;">0</td>
                        </tr>
                        <tr>
                            <td>IRPP sur BAIC à payer ou crédit</td>
                            <td></td>
                            <td class="tab active disabled-cell c5-irpp-paid-cred-principal" style="text-align: left; width: 120px;">0</td>
                            <td class="tab active disabled-cell c5-irpp-paid-cred-cac" style="text-align: left; width: 90px;">0</td>
                            <td class="tab active disabled-cell c5-irpp-paid-cred-pen" style="text-align: left; width: 120px;">0</td>
                            <td class="tab active disabled-cell c5-irpp-paid-cred-total" style="text-align: left; width: 120px;">0</td>
                        </tr>
                        </tfoot>
                    </table>
                    </fieldset>
                </div>`;
            },
            compute(panel){
                const tbody = panel.querySelector("tbody");

                panel.addEventListener("input", (e) =>{
                    if (e.target.type === "number") {
                        calculateTotals();
                    }
                });
                function calculateTotals() {
                    let totalCa = 0;
                    let totalMb = 0;
                    let totalBi = 0;

                    tbody.querySelectorAll("tr").forEach(row => {
                        const ca = parseInt(row.querySelector(".c5-ca")?.value) || 0;
                        const mb = parseInt(row.querySelector(".c5-marge-brut")?.value) || 0;
                        const bi = parseInt(row.querySelector(".c5-ben-imp")?.value) || 0;

                        totalCa += ca;
                        totalMb += mb;
                        totalBi += bi;
                    });

                    panel.querySelector("#c5-total-ca").textContent = totalCa;
                    panel.querySelector("#c5-total-mb").textContent = totalMb;
                    panel.querySelector("#c5-total-bi").textContent = totalBi;

                }
            }
        }
    };

    // ---------- montage dynamique depuis la sélection ----------
    const selected = JSON.parse(sessionStorage.getItem('selectedCategories')||'[]');
    const tabs = document.getElementById('tabs');
    const panels = document.getElementById('panels');

    if (!selected.length) {
      // fallback si accès direct
      tabs.innerHTML = '<div class="tab">Aucune catégorie sélectionnée. <a href="select.html">Revenir</a></div>';
    } else {
      // Crée onglets + panneaux
      selected.forEach((id, idx)=>{
        const cat = Catalog[id];
        if (!cat) return;
        const t = document.createElement('button');
        t.className = 'tab'+(idx===0?' active':'');
        t.textContent = cat.title;
        t.dataset.target = 'panel-'+id;
        tabs.appendChild(t);

        panels.insertAdjacentHTML('beforeend', cat.render());
        panels.lastElementChild.classList.toggle('active', idx===0);
      });

      // navigation tabs
      tabs.addEventListener('click', (e)=>{
        const btn = e.target.closest('.tab'); if (!btn) return;
        document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.target).classList.add('active');
      });

      // calcul global (écoute tous les inputs)
      const recalcAll = ()=>{
        let grand = 0;
        selected.forEach(id=>{
          const cat = Catalog[id];
          const panel = document.getElementById('panel-'+id);
          if (cat && panel) grand += cat.compute(panel);
        });
        document.getElementById('grandTotal').textContent = fmt(grand);
      };
      document.addEventListener('input', recalcAll);
      // 1er calcul au chargement
      recalcAll();
    }

    // "Enregistrer" = exemple : sauvegarde JSON dans sessionStorage (à brancher selon besoin)
    document.getElementById('save').onclick = ()=>{
      const payload = { when: new Date().toISOString(), categories: selected };
      sessionStorage.setItem('irpp_last_save', JSON.stringify(payload));
      alert('Brouillon enregistré.');
    };
  </script>
</body>
</html>
